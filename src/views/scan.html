<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/qrCodeScanner.js" integrity="sha512-k/KAe4Yff9EUdYI5/IAHlwUswqeipP+Cp5qnrsUjTPCgl51La2/JhyyjNciztD7mWNKLSXci48m7cctATKfLlQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
 
    <title>Scanning</title>

    <style>
        main {
        display: flex;
        justify-content: center;
        align-items: center;
        }
        #reader {
        width: 600px;
        }
        #result {
        text-align: center;
        font-size: 1.5rem;
        }
    </style>

</head>
<body>
        <main>
            <div id="reader"></div>
            <div id="result"></div>
        </main>
        <button class="scanBtn" type="button" id="scan"> Scan</button>
    
    <script>

        const scanner = new Html5QrcodeScanner('reader', {
            qrbox: {
                width: 250,
                height: 250,
            },
          ps: 20,
        });

        document.getElementById("scan").addEventListener("click", function(){
            scanner.render(onSuccess, onError);
        })


        function onSuccess(result){
            document.getElementById("result").innerText = result
        }


        function onError(err){
            document.getElementById("result").innerText = "error : "+err
        }
    </script>
</body>
</html>
