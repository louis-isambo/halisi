<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/leistrap.js"></script>
    <script src="/js/qrgenerator.js"></script>
    <script src="/js/qfetching.js"></script>
    <link rel="stylesheet" href="/css/leistrap.css">
    <link rel="stylesheet" href="/css/header.css">
    <title>Ajouter un invité</title>

    <style>
        .cardADD{
            padding: 20px;
            gap:.5rem;
            width: 400px;
            min-height:  200px;
            outline: none;
            border: 1ps solid #aaa;
            border-radius: 8px;
            margin: 25vh auto;
            background-color: #fff;
        }
        #name, #link{
            padding:  5px 7px;
            border: 1px solid #aaa;
        }

        .inputs{
            gap: .8rem;
        }

        #msgError{
            padding: 10px 14px ;
            width: 100%;
            background-color: #fa919b77;
            border: 1.5px solid #ff485ab2;
            outline: none;
            border-radius: 8px;
        }

        #copyText{
            
            background-color: #dddddde1;
            padding: 5px 10px;
            border-radius: 6px;
            float: right;
            top: -5px;
            cursor: pointer;
        }
        @media screen and (max-width : 800px) {
            
            .cardADD{
                width: 90%;
              
            }
        }
    </style>
</head>
<body>
    
    <header>
        <ul class="leis-flex leis-row">
            <li> <a href="/login"> Login</a></li>
            <li> <a href="/services"> Evènement</a></li>
            <li> <a href="/admins"> Admins</a></li>
        </ul>
    </header>

    <div class="leis-flex cardADD">
        <h2>Ajouter un invité </h2>
       <div class="leis-flex inputs">
        <div>
            <label for="name"> Nom </label>
            <input  class="leis-textinput" id="name" placeholder="Nom de l'invité" type="text">
        </div>

       <div hidden id="lp">
        <label for="link"> Lien</label>   
        <span id="copyText">copier</span>
        <input  class="leis-textinput" id="link" placeholder="partager" type="text">
      
       </div>
       <p id="msgError" hidden></p>
       </div>
       <div class="leis-flex">
            <button type="button" class="leis-btn leis-btn-success" id="c"> Ajouter </button>
       </div>
    </div>

    <script>
        let cp =  document.getElementById("copyText")
        let linkCp =  document.getElementById("link")

        document.getElementById("name").addEventListener("focus", function(){
            cp.textContent = "Copier";
        })
        linkCp.addEventListener("focus", function(){
            cp.textContent = "Copier";
            
        })
        cp.addEventListener("click", function(){
            navigator.clipboard.writeText(linkCp.value).then(() => {
               cp.textContent = "Lien copié avec succès !";
         
            }).catch(err => {

            cp.textContent = "Impossible de copier le texte.";
        });
           
        })

        const url = location.pathname.split("/")
        
        document.getElementById("c").addEventListener("click", function(){
            const linkShare = document.getElementById("link")
            linkShare.value = ""
            document.getElementById("lp").setAttribute("hidden", "true")
            document.getElementById("msgError").setAttribute("hidden", "true")

            const GustName = document.getElementById("name").value
            const path = location.protocol + location.host
            
            leistrap.event.invoke("event:addgust", null, {key: url[url.length - 1], name : GustName }, function(res){
                        document.getElementById("lp").removeAttribute("hidden")
                        linkShare.value = path+"/iv/"+res.data.key
                        document.getElementById("name").value = ""

                })
           
        })

    </script>


   
</body>
</html>
