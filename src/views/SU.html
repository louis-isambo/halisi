<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/leistrap.js"></script>
    <script src="/js/qrgenerator.js"></script>
    <script src="/js/qfetching.js"></script>
    <link rel="stylesheet" href="/css/leistrap.css">
    <title>Ajouter un invité</title>

    <style>
        .cardADD{
            padding: 20px;
            gap:.5rem;
            width: 400px;
            min-height:  200px;
            outline: none;
            border: 1ps solid #aaa;
            border-radius: 8px;
            margin: 25vh auto;
            background-color: #fff;
        }
        #name, #link{
            padding:  5px 7px;
            border: 1px solid #aaa;
        }

        .inputs{
            gap: .8rem;
        }

        #msgError{
            padding: 10px 14px ;
            width: 100%;
            background-color: #fa919b77;
            border: 1.5px solid #ff485ab2;
            outline: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    


    <div class="leis-flex cardADD">
        <h2>Créer un admin</h2>
       <div class="leis-flex inputs">
        <div>
            <label for="name"> Email</label>
            <input  class="leis-textinput" id="email" placeholder="Nom de l'admin" type="email">
        </div>

       <div>
        <label for="link">Mot de passe</label>
        <input  class="leis-textinput" id="password" placeholder="Mot de passe" type="password">
       </div>
       <p id="msgOk" ></p>
       <p id="msgError" hidden></p>
       </div>
       <div class="leis-flex">
            <button type="button" class="leis-btn leis-btn-success" id="c"> Créer </button>
       </div>
    </div>

    <script>
        
        const url = location.pathname.split("/")
        
        document.getElementById("c").addEventListener("click", function(){
            const ad = {
                email : document.getElementById("email").value,
                password : document.getElementById("password").value
            }
            
            document.getElementById("msgOk").setAttribute("hidden", "true")
            document.getElementById("msgError").setAttribute("hidden", "true")
            
            leistrap.event.invoke("auth", null, ad, function(res){
                       const msg =  document.getElementById("msgOk")
                       msg.removeAttribute("hidden")
                       msg.innerText = "Admin ajouté avec succès !"
                       document.getElementById("password").value = ""
                       document.getElementById("email").value = ""
                })
           
        })

    </script>
</body>
</html>
